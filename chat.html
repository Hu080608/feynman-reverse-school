<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.feynman-hsj.top http://127.0.0.1:8787 http://localhost:8787; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>费曼反向学校｜对话</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="css/styles.css?v=42" />
  <link rel="stylesheet" href="css/responsive.css?v=42" />
</head>
<body class="page-chat" data-page="chat">
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="assets/logo.svg" alt="费曼反向学校" />
      <div><h1>费曼反向学校</h1><p id="chatBrandSubtitle">正在对话</p></div>
    </div>
    <div class="status-pills">
      <a class="pill" href="account.html">账号</a>
      <span class="pill" id="licensePill">已授权</span>
      <span class="pill" id="timePill" title="点击查看全部余额" style="cursor:pointer;">剩余：--</span>
    </div>
    <div id="balancePanel" class="balance-panel hidden"></div>
  </header>

  <main class="chat-page">
    <section class="chat-panel">
      <div class="chat-head">
        <div>
          <h2 id="chatTitle">与 AI 学生对话</h2>
          <p class="hint" id="chatSubtitle">AI 学生会先提问；你讲不清时，它绝不假装懂。</p>
        </div>
        <div class="chat-head-actions">
          <button id="pauseExitBtn" class="btn small">暂停对话并退出</button>
          <button id="endSessionBtn" class="btn small danger">结束本次对话（我已完全掌握本知识点）</button>
        </div>
      </div>

      <div id="readonlyBanner" class="readonly-banner hidden">只读模式：当前只能查看历史对话，不能发送。</div>
      <div id="chatMessages" class="chat-messages">
        <div class="empty-state">
          <p>正在准备对话……</p>
        </div>
      </div>

      <div id="apiError" class="api-error hidden"></div>

      <div class="composer">
        <label for="userInput" class="sr-only">你的讲解</label>
        <textarea id="userInput" rows="3" placeholder="用你自己的话讲解这个知识点。"></textarea>
        <p id="lockHint" class="lock-hint">正在检查授权状态……</p>
        <div class="composer-actions">
          <span class="hint" id="turnHint"></span>
          <div>
            <button id="hintBtn" class="btn small">请学生解释上一题</button>
            <button id="retryBtn" class="btn small hidden">重试上一条</button>
            <button id="sendBtn" class="btn primary">发送讲解</button>
          </div>
        </div>
      </div>
      <p class="app-meta" data-app-meta style="text-align:center;padding:6px 0 10px;"></p>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="vendor/marked/marked.min.js" defer></script>
  <script src="vendor/dompurify/purify.min.js" defer></script>
  <script src="vendor/katex/katex.min.js" defer></script>
  <script src="vendor/katex/contrib/auto-render.min.js" defer></script>
  <script src="js/config.js" defer></script>
  <script src="js/backend.js" defer></script>
  <script src="js/app.js?v=42" defer></script>
</body>
</html>
